# =============================================================================
# Midea XYE HVAC - device file (copy into your ESPHome config folder)
# =============================================================================
# One file works for every unit: the device name gets the last 6 hex digits
# of the ESP's MAC address appended (midea-xye-hvac-a1b2c3), so several units
# can run the same file. Rename the device in Home Assistant afterwards.
#
# secrets.yaml needs: wifi_ssid, wifi_password, ota_password
# =============================================================================

substitutions:
  name: midea-xye-hvac
  friendly_name: "Midea XYE HVAC"
  # RS-485 transceiver pins (auto-direction board: RX/TX only)
  xye_rx_pin: GPIO16
  xye_tx_pin: GPIO17
  climate_name: "HVAC"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  name_add_mac_suffix: true
  project:
    name: "GITHUB_OWNER.midea-xye-hvac"
    version: "1.0.0"

esp32:
  board: esp32-s3-devkitc-1     # change for your board, e.g. esp32dev
  variant: esp32s3
  framework:
    type: arduino

packages:
  midea_xye:
    url: https://github.com/GITHUB_OWNER/midea-xye-hvac
    ref: main
    files: [midea-xye-hvac.yaml]
    refresh: 1d

logger:
  level: INFO

api:

ota:
  - platform: esphome
    password: !secret ota_password
  - platform: web_server

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    ssid: "Midea XYE HVAC Setup"
    password: !secret wifi_password

captive_portal:

web_server:
  port: 80
  version: 3

sensor:
  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
  - platform: uptime
    name: "Uptime"
    update_interval: 60s
